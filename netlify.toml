[build]
  publish = "."

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[identity]
  [identity.external]
    github = false
    gitlab = false
    bitbucket = false
    google = false

[gateway]
  identity_instance_url = "/.netlify/identity"
