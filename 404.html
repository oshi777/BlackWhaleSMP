    <style>
        :root {
            --bg:      #0B0C0E;
            --surface: #1E2126;
            --muted:   #3A3F47;
            --silver:  #C3C7CE;
            --light:   #F8F8F9;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--light); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--surface); }
        ::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 5px; }

        .logo { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 1.4rem; color: var(--light); text-decoration: none; margin-bottom: 48px; }
        .logo-icon { width: 40px; height: 40px; flex-shrink: 0; }
        .logo-icon img { width: 40px; height: 40px; object-fit: contain; display: block; background: var(--muted); border-radius: 8px; padding: 4px; }

        .error-code { font-size: 8rem; font-weight: 800; line-height: 1; background: linear-gradient(135deg, var(--light) 0%, var(--muted) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 16px; }
        .error-title { font-size: 1.6rem; font-weight: 700; color: var(--light); margin-bottom: 12px; }
        .error-sub { color: var(--silver); font-size: 1rem; margin-bottom: 40px; max-width: 420px; }

        .nav-cards { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 40px; }
        .nav-card { background: var(--surface); border: 1px solid rgba(195,199,206,0.1); border-radius: 12px; padding: 16px 22px; text-decoration: none; color: var(--silver); font-size: 0.9rem; font-weight: 500; display: flex; align-items: center; gap: 10px; transition: all 0.3s; }
        .nav-card:hover { border-color: var(--muted); color: var(--light); transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }

        .btn { padding: 12px 28px; border-radius: 8px; font-weight: 600; font-size: 0.95rem; text-decoration: none; display: inline-block; transition: all 0.3s; background: var(--muted); color: var(--light); border: none; cursor: pointer; font-family: 'Inter', sans-serif; }
        .btn:hover { background: var(--silver); color: var(--bg); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.3); }

        @media (max-width: 480px) { .error-code { font-size: 5rem; } .error-title { font-size: 1.3rem; } .nav-cards { flex-direction: column; align-items: stretch; } }
    </style>
</head>

</body>
</html>
